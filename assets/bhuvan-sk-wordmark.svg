<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="120">
  <defs>
    <!-- Background grid -->
    <pattern id="fineGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>

    <!-- Main text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>
  </defs>

  <!-- Base Grid -->
  <rect width="100%" height="100%" fill="url(#fineGrid)" />

  <!-- Technical Framing Lines -->
  <line x1="40" y1="20" x2="560" y2="20" stroke="#30363d" stroke-width="1" />
  <line x1="40" y1="100" x2="560" y2="100" stroke="#30363d" stroke-width="1" />
  
  <!-- Corner Crosshairs -->
  <path d="M 36 20 L 44 20 M 40 16 L 40 24" stroke="#8b949e" stroke-width="1" fill="none" />
  <path d="M 556 20 L 564 20 M 560 16 L 560 24" stroke="#8b949e" stroke-width="1" fill="none" />
  <path d="M 36 100 L 44 100 M 40 96 L 40 104" stroke="#8b949e" stroke-width="1" fill="none" />
  <path d="M 556 100 L 564 100 M 560 96 L 560 104" stroke="#8b949e" stroke-width="1" fill="none" />

  <!-- Subtle Metadata Labels -->
  <text x="50" y="32" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8b949e" letter-spacing="1">USR_ID: B-SK</text>
  <text x="470" y="32" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#58a6ff" letter-spacing="1">STATUS: ONLINE</text>
  
  <text x="50" y="94" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8b949e" letter-spacing="1">LOC: 12.97N 77.59E</text>
  <text x="495" y="94" font-family="'SF Mono', Consolas, monospace" font-size="9" fill="#8b949e" letter-spacing="1">SYS_V1.0</text>

  <!-- Main Wordmark -->
  <text x="290" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="10" text-anchor="middle" dominant-baseline="middle" fill="url(#textGrad)">BHUVAN SK</text>
  
  <!-- Subtle Animated Signal/Data Line -->
  <line x1="40" y1="20" x2="100" y2="20" stroke="#58a6ff" stroke-width="1">
    <animate attributeName="x1" values="40;460;40" dur="6s" repeatCount="indefinite" />
    <animate attributeName="x2" values="100;560;100" dur="6s" repeatCount="indefinite" />
  </line>

  <!-- Subtitle Terminal Cursor -->
  <rect x="470" y="48" width="12" height="24" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
