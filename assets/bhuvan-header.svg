<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="120">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="1" opacity="0.4"/>
    </pattern>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#388bfd"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <style>
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 68px;
      font-weight: 900;
      letter-spacing: 20px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .text-outline {
      fill: none;
      stroke: url(#accentGrad);
      stroke-width: 1.5;
      stroke-dasharray: 8 4;
      opacity: 0.8;
    }
    .text-main {
      fill: url(#textGrad);
    }
    .accent-element {
      fill: url(#accentGrad);
    }
  </style>

  <!-- Technical aesthetic elements -->
  <rect x="50" y="20" width="12" height="3" class="accent-element" opacity="0.6" />
  <rect x="65" y="20" width="4" height="3" class="accent-element" opacity="0.6" />
  
  <rect x="530" y="97" width="12" height="3" class="accent-element" opacity="0.6" />
  <rect x="545" y="97" width="4" height="3" class="accent-element" opacity="0.6" />
  
  <path d="M 20 50 L 20 80" stroke="#30363d" stroke-width="2" fill="none" />
  <path d="M 580 50 L 580 80" stroke="#30363d" stroke-width="2" fill="none" />

  <g transform="translate(305, 62)">
    <!-- Animated outline layer offset for tech feel -->
    <text class="text-title text-outline" x="-4" y="-4">BHUVAN
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3s" repeatCount="indefinite" />
    </text>
    
    <!-- Solid main layer -->
    <text class="text-title text-main" x="0" y="0">BHUVAN</text>
  </g>
</svg>
