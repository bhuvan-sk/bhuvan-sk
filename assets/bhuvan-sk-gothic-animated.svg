<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="120">
  <style>
    .wordmark {
      font-family: 'Times New Roman', Times, Georgia, serif;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #e2e8f0; /* Soft off-white / silver */
    }
  </style>

  <!-- Base Wordmark: Vertically elongated for subtle gothic proportion -->
  <g transform="translate(300, 65) scale(0.85, 1.4)">
    <text x="7" y="0" class="wordmark">BHUVAN SK</text>
  </g>
  
  <!-- ONE tiny elegant gothic diamond with a very slow, subtle drift and pulse -->
  <!-- Placed directly above the center of the wordmark -->
  <g fill="#7c3aed" opacity="0.7">
    <!-- A 8px x 12px four-pointed gothic star/diamond -->
    <path d="M 300,14 C 300.5,19 301.5,19.5 304,20 C 301.5,20.5 300.5,21 300,26 C 299.5,21 298.5,20.5 296,20 C 298.5,19.5 299.5,19 300,14 Z" />
    
    <!-- Slow breathing pulse (6s cycle) -->
    <animate attributeName="opacity" values="0.25;0.85;0.25" dur="6s" repeatCount="indefinite" />
    
    <!-- Gentle vertical drift (8s cycle, moves 3px up and down) -->
    <animateTransform attributeName="transform" type="translate" values="0,1; 0,-3; 0,1" dur="8s" repeatCount="indefinite" />
  </g>
</svg>
