<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="120">
  <style>
    .wordmark {
      font-family: 'Times New Roman', Times, Georgia, serif;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #e2e8f0; /* Soft off-white / silver */
    }
  </style>

  <!-- Typography: EXACTLY identical to the static version -->
  <g transform="translate(300, 65) scale(0.85, 1.4)">
    <text x="7" y="0" class="wordmark">BHUVAN SK</text>
  </g>
  
  <!-- ONE tiny living gothic element: A delicate moth -->
  <g>
    <!-- Slow organic positional drift (14s cycle) -->
    <animateTransform attributeName="transform" type="translate" 
      values="0,0; -6,3; -6,3; 4,-5; 4,-5; 0,0" 
      keyTimes="0; 0.2; 0.4; 0.6; 0.8; 1" 
      dur="14s" repeatCount="indefinite" />
      
    <!-- Positioned slightly above and to the right of the "SK" -->
    <g transform="translate(465, 30)">
      
      <!-- Tiny Gothic Moth Body -->
      <polygon points="0,-4 1.5,0 0,6 -1.5,0" fill="#64748b" />
      
      <!-- Delicate antennae -->
      <path d="M -0.5,-4 Q -3,-8 -4,-5" fill="none" stroke="#475569" stroke-width="0.75"/>
      <path d="M 0.5,-4 Q 3,-8 4,-5" fill="none" stroke="#475569" stroke-width="0.75"/>
      
      <!-- Left Wing Assembly -->
      <g>
        <!-- Intermittent fluttering animation -->
        <animateTransform attributeName="transform" type="scale" 
          values="1,1; 0.1,1; 1,1; 0.1,1; 1,1; 0.1,1; 1,1; 1,1" 
          keyTimes="0; 0.03; 0.06; 0.09; 0.12; 0.15; 0.18; 1" 
          dur="5.5s" repeatCount="indefinite" />
          
        <!-- Sharp upper forewing -->
        <path d="M 0,-2 C -8,-10 -14,-5 -12,4 C -9,12 -3,6 0,2 Z" fill="#94a3b8" opacity="0.85"/>
        <!-- Sweeping lower hindwing with subtle violet accent -->
        <path d="M 0,2 C -5,8 -9,8 -7,12 C -5,14 -2,10 0,6 Z" fill="#8b5cf6" opacity="0.6"/>
        <!-- Thin geometric wing vein -->
        <path d="M -2,0 L -7,-2" stroke="#e2e8f0" stroke-width="0.5" opacity="0.8"/>
      </g>
      
      <!-- Right Wing Assembly -->
      <g>
        <!-- Matches the left wing flutter -->
        <animateTransform attributeName="transform" type="scale" 
          values="1,1; 0.1,1; 1,1; 0.1,1; 1,1; 0.1,1; 1,1; 1,1" 
          keyTimes="0; 0.03; 0.06; 0.09; 0.12; 0.15; 0.18; 1" 
          dur="5.5s" repeatCount="indefinite" />
          
        <path d="M 0,-2 C 8,-10 14,-5 12,4 C 9,12 3,6 0,2 Z" fill="#94a3b8" opacity="0.85"/>
        <path d="M 0,2 C 5,8 9,8 7,12 C 5,14 2,10 0,6 Z" fill="#8b5cf6" opacity="0.6"/>
        <path d="M 2,0 L 7,-2" stroke="#e2e8f0" stroke-width="0.5" opacity="0.8"/>
      </g>
      
    </g>
  </g>
</svg>
