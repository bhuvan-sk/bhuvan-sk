<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="120">
  <style>
    .wordmark {
      font-family: 'Times New Roman', Times, Georgia, serif;
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: #e2e8f0; /* Soft off-white / silver */
    }
  </style>

  <!-- Typography: EXACTLY identical to the static version -->
  <g transform="translate(300, 65) scale(0.85, 1.4)">
    <text x="7" y="0" class="wordmark">BHUVAN SK</text>
  </g>
  
  <!-- ONE tiny living gothic element: A delicate ornamental vine -->
  <!-- Placed subtly to the right of the "K", matching the letter height -->
  <g transform="translate(450, 65)">
    <!-- Anchor the organic sway at the baseline (0, 15) -->
    <animateTransform attributeName="transform" type="rotate" 
      values="0 0 15; 4 0 15; -1.5 0 15; 0 0 15" 
      keyTimes="0; 0.4; 0.75; 1" 
      dur="14s" repeatCount="indefinite" />
      
    <g>
      <!-- Secondary organic bend (skew) on a different time cycle for life-like movement -->
      <animateTransform attributeName="transform" type="skewX" 
        values="0; -2; 1.5; 0" 
        keyTimes="0; 0.45; 0.8; 1" 
        dur="11s" repeatCount="indefinite" />
      
      <!-- Elegant sweeping gothic S-curve stem with a curled tip -->
      <path d="M -2,15 C -2,5 -8,-2 0,-12 C 6,-20 14,-10 6,-6 C 2,-2 0,-9 3,-12" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
      
      <!-- Sharp elegant gothic thorns -->
      <!-- Lower left thorn -->
      <polygon points="-4,6 -9,3 -5,8" fill="#64748b" />
      <!-- Upper right thorn -->
      <polygon points="1,-6 5,-9 2,-4" fill="#64748b" />
      
      <!-- Deep subtle violet accent (tiny gothic leaf/blade) -->
      <polygon points="-5,-4 -10,-6 -6,-1" fill="#7c3aed" opacity="0.8" />
    </g>
  </g>
</svg>
