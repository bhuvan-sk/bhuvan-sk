<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <!-- Deep Metallic Chrome Gradient (High Contrast for #0D1117) -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="48%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="52%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Subtle Deep Violet Accent -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>

    <!-- Metallic Shimmer for the Animation -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <style>
    .gothic-text {
      font-family: 'Times New Roman', Times, Georgia, serif;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: url(#chrome);
    }
    .text-shadow {
      font-family: 'Times New Roman', Times, Georgia, serif;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: none;
      stroke: #0d1117;
      stroke-width: 14px;
      stroke-linejoin: round;
    }
    .sigil-path {
      fill: none;
      stroke: url(#chrome);
      stroke-width: 1.5;
      stroke-linejoin: bevel;
    }
    .accent-path {
      fill: none;
      stroke: url(#accent);
      stroke-width: 1;
    }
  </style>

  <!-- Absolutely Transparent Background -->

  <!-- Cyber-Sigil / Gothic Ornamental Geometry -->
  <g transform="translate(400, 110)">
    
    <!-- Outer Gothic Sickle Blades -->
    <path class="sigil-path" d="M -340,0 C -280,-40 -200,-50 -150,-10 C -190,-40 -250,-20 -300,0 C -250,20 -190,40 -150,10 C -200,50 -280,40 -340,0 Z" />
    <path class="sigil-path" d="M 340,0 C 280,-40 200,-50 150,-10 C 190,-40 250,-20 300,0 C 250,20 190,40 150,10 C 200,50 280,40 340,0 Z" />
    
    <!-- Central Gothic Arches (Above and Below the Name) -->
    <path class="sigil-path" d="M -120,-55 Q -60,-85 0,-65 Q 60,-85 120,-55 Q 80,-70 0,-55 Q -80,-70 -120,-55 Z" />
    <path class="sigil-path" d="M -120,55 Q -60,85 0,65 Q 60,85 120,55 Q 80,70 0,55 Q -80,70 -120,55 Z" />
    
    <!-- Vertical Gothic Spires (Sharp points extending outwards) -->
    <path class="sigil-path" d="M -12,-65 L 0,-100 L 12,-65 L 0,-70 Z" fill="url(#chrome)" />
    <path class="sigil-path" d="M -12,65 L 0,100 L 12,65 L 0,70 Z" fill="url(#chrome)" />
    
    <!-- Inner Geometric Thorns intersecting the space -->
    <path class="sigil-path" d="M -160,-15 L -120,-35 L -80,-15 L -40,-30" />
    <path class="sigil-path" d="M -160,15 L -120,35 L -80,15 L -40,30" />
    <path class="sigil-path" d="M 160,-15 L 120,-35 L 80,-15 L 40,-30" />
    <path class="sigil-path" d="M 160,15 L 120,35 L 80,15 L 40,30" />

    <!-- Subtle Dark Crimson/Violet Accents to anchor the gothic feel -->
    <path class="accent-path" d="M -130,-35 L -90,-55 L -50,-40" opacity="0.7" />
    <path class="accent-path" d="M 130,-35 L 90,-55 L 50,-40" opacity="0.7" />
    <path class="accent-path" d="M -130,35 L -90,55 L -50,40" opacity="0.7" />
    <path class="accent-path" d="M 130,35 L 90,55 L 50,40" opacity="0.7" />
    
    <!-- Central Blood-Red Jewel Nodes -->
    <circle cx="0" cy="-65" r="3" fill="#7f1d1d" stroke="none" />
    <circle cx="0" cy="65" r="3" fill="#7f1d1d" stroke="none" />
  </g>

  <!-- True Gothic Typography Layer (Scaled for blackletter proportions) -->
  <g transform="translate(400, 110) scale(0.9, 1.6)">
    <!-- Heavy cutout shadow so the text slices cleanly through the background sigils -->
    <text x="6" y="3" class="text-shadow">BHUVAN SK</text>
    <!-- Main gothic lettering -->
    <text x="6" y="3" class="gothic-text">BHUVAN SK</text>
  </g>

  <!-- Ambient Light Sweep (Slow metallic shimmer passing over text) -->
  <g transform="translate(400, 110) scale(0.9, 1.6)">
    <mask id="textMask">
      <text x="6" y="3" font-family="'Times New Roman', Times, Georgia, serif" font-size="72" font-weight="900" letter-spacing="12" text-anchor="middle" dominant-baseline="middle" fill="white">BHUVAN SK</text>
    </mask>
    <rect x="-500" y="-80" width="120" height="160" fill="url(#shimmer)" mask="url(#textMask)" opacity="0.8" transform="skewX(-30)">
      <animate attributeName="x" from="-500" to="600" dur="6s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
