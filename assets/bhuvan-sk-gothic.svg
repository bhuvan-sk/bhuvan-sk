<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="100%" height="100">
  <defs>
    <!-- Soft silver gradient for premium typography -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <style>
    .gothic-wordmark {
      font-family: 'Times New Roman', Times, Georgia, serif;
      font-size: 38px;
      letter-spacing: 18px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: url(#silver);
    }
  </style>
  
  <!-- ONE tiny elegant gothic ornament (Elongated cross/star) -->
  <g transform="translate(300, 20)">
    <path d="M 0,-12 C 0.5,-3 1,-1 6,0 C 1,1 0.5,3 0,16 C -0.5,3 -1,1 -6,0 C -1,-1 -0.5,-3 0,-12 Z" fill="#8b5cf6" opacity="0.75"/>
  </g>

  <!-- Vertically elongated typography for a clean modern gothic silhouette -->
  <!-- Scaled Y by 1.45 to create the tall blackletter/editorial proportion -->
  <!-- Scaled X by 0.85 to condense the letters -->
  <g transform="translate(300, 65) scale(0.85, 1.45)">
    <!-- Offset X by 9 to precisely optical-center the 18px letter-spacing -->
    <text x="9" y="0" class="gothic-wordmark">BHUVAN SK</text>
  </g>
</svg>
