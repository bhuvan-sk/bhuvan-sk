<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="240">
  <defs>
    <!-- Deep Metallic Chrome Gradient for the True Y2K Metal Look -->
    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#cbd5e1"/>
      <stop offset="47%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="53%" stop-color="#64748b"/>
      <stop offset="85%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Subtle Cold Violet Accent -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Text Glow for ambient cyber effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .gothic-text {
      font-family: 'Times New Roman', Times, Georgia, serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: url(#chrome);
    }
    .text-outline {
      font-family: 'Times New Roman', Times, Georgia, serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: none;
      stroke: #0d1117;
      stroke-width: 12px;
      stroke-linejoin: round;
    }
    .sigil-line {
      fill: none;
      stroke: url(#chrome);
      stroke-width: 1.5;
      stroke-linejoin: miter;
      stroke-miterlimit: 10;
    }
    .sigil-accent {
      fill: none;
      stroke: url(#accent);
      stroke-width: 1;
    }
  </style>

  <!-- Cyber-Sigil Background Art -->
  <g transform="translate(350, 120)">
    
    <!-- True Tribal / Cyber-Sigil Geometry -->
    <g class="sigil-line">
      <!-- Central Top/Bottom Crests (Thorn-like) -->
      <path d="M 0,-110 Q 8,-60 0,-45 Q -8,-60 0,-110 Z" fill="url(#chrome)"/>
      <path d="M 0,110 Q 8,60 0,45 Q -8,60 0,110 Z" fill="url(#chrome)"/>
      
      <!-- Seraphim-like razor arcs -->
      <path d="M 0,-45 Q 70,-70 140,-35 Q 100,-15 70,-25 Q 35,-35 0,-45" />
      <path d="M 0,-45 Q -70,-70 -140,-35 Q -100,-15 -70,-25 Q -35,-35 0,-45" />
      <path d="M 0,45 Q 70,70 140,35 Q 100,15 70,25 Q 35,35 0,45" />
      <path d="M 0,45 Q -70,70 -140,35 Q -100,15 -70,25 Q -35,35 0,45" />
      
      <!-- Lateral razor wire / abstract digital vines -->
      <path d="M -300,0 L -240,-15 L -180,0 L -120,-25 L -60,-8 L 0,-18 L 60,-8 L 120,-25 L 180,0 L 240,-15 L 300,0" />
      <path d="M -300,0 L -240,15 L -180,0 L -120,25 L -60,8 L 0,18 L 60,8 L 120,25 L 180,0 L 240,15 L 300,0" />
      
      <!-- Vertical intersection spikes for mechanical detail -->
      <path d="M -180,-10 L -180,10" />
      <path d="M 180,-10 L 180,10" />
      <path d="M -240,-25 L -240,25" opacity="0.4" />
      <path d="M 240,-25 L 240,25" opacity="0.4" />
      
      <!-- Diamond cross nodes -->
      <polygon points="-120,-25 -115,-20 -120,-15 -125,-20" fill="url(#chrome)" stroke="none"/>
      <polygon points="120,-25 125,-20 120,-15 115,-20" fill="url(#chrome)" stroke="none"/>
      <polygon points="-120,25 -115,20 -120,15 -125,20" fill="url(#chrome)" stroke="none"/>
      <polygon points="120,25 125,20 120,15 115,20" fill="url(#chrome)" stroke="none"/>
    </g>

    <!-- Deep violet accents slicing through -->
    <g class="sigil-accent">
      <path d="M -80,-80 L 0,-30 L 80,-80" opacity="0.8"/>
      <path d="M -80,80 L 0,30 L 80,80" opacity="0.8"/>
      <!-- Tiny red blood-dot accents (subtle) -->
      <circle cx="0" cy="-30" r="1.5" fill="#991b1b" stroke="none" filter="url(#glow)"/>
      <circle cx="0" cy="30" r="1.5" fill="#991b1b" stroke="none" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Typography Layer (Elongated and Gothicized) -->
  <g transform="translate(350, 120) scale(0.9, 1.4)">
    <!-- Heavy outline cuts a dark void through the sigils to preserve 100% text readability -->
    <text x="7" y="3" class="text-outline">BHUVAN SK</text>
    <!-- Main metallic gothic text -->
    <text x="7" y="3" class="gothic-text">BHUVAN SK</text>
  </g>

  <!-- Ambient Light Sweep (Subtle metallic shimmer passing over text) -->
  <g transform="translate(350, 120) scale(0.9, 1.4)">
    <mask id="textMask">
      <text x="7" y="3" font-family="'Times New Roman', Times, Georgia, serif" font-size="64" font-weight="900" letter-spacing="14" text-anchor="middle" dominant-baseline="middle" fill="white">BHUVAN SK</text>
    </mask>
    <rect x="-400" y="-80" width="100" height="160" fill="url(#accent)" mask="url(#textMask)" opacity="0.6" transform="skewX(-25)">
      <animate attributeName="x" from="-400" to="500" dur="7s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
